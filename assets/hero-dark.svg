<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 264" width="920" height="264" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 40) rotate(32) scale(440 240)">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 220) rotate(-25) scale(380 230)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentBase" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="44" y1="88" x2="540" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="918" height="262" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="918" height="262" rx="18" fill="url(#bg)"/>
    <rect x="1" y="1" width="918" height="262" rx="18" fill="url(#dots)"/>
    <rect x="1" y="1" width="918" height="262" rx="18" fill="url(#glowBlue)"/>
    <rect x="1" y="1" width="918" height="262" rx="18" fill="url(#glowPurple)"/>

    <!-- Subtle rotating geometric sharingan-inspired crest behind terminal -->
    <g transform="translate(860 65)" opacity="0.14">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="88" stroke="#e11d48" stroke-width="2" stroke-dasharray="14 8"/>
        <circle cx="0" cy="0" r="64" stroke="#c084fc" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="22" stroke="#e11d48" stroke-width="2"/>
        <circle cx="0" cy="-64" r="6" fill="#e11d48"/>
        <circle cx="55.4" cy="32" r="6" fill="#e11d48"/>
        <circle cx="-55.4" cy="32" r="6" fill="#e11d48"/>
      </g>
    </g>

    <!-- Floating ambient particles -->
    <circle cx="515" cy="52" r="2.2" fill="#38bdf8" opacity="0.45">
      <animate attributeName="cy" values="52;42;52" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="538" cy="184" r="2.6" fill="#c084fc" opacity="0.4">
      <animate attributeName="cy" values="184;196;184" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="486" cy="222" r="1.8" fill="#818cf8" opacity="0.4">
      <animate attributeName="cy" values="222;212;222" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Top & bottom animated shimmer bars -->
    <rect x="40" y="1" width="840" height="2.5" rx="1.25" fill="url(#accentBase)"/>
    <rect x="-260" y="1" width="260" height="3" rx="1.5" fill="url(#accentSweep)">
      <animate attributeName="x" values="-260;920" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="260.5" width="840" height="2" rx="1" fill="url(#accentBase)" opacity="0.5"/>
  </g>

  <rect x="1" y="1" width="918" height="262" rx="18" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Status pill with radar pulse -->
  <rect x="44" y="32" width="276" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="62" cy="46" r="7" fill="#22c55e" opacity="0.25">
    <animate attributeName="r" values="4.5;9;4.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="46" r="4.2" fill="#22c55e"/>
  <text x="77" y="50" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="600">
    Open to Collaborate &#8226; Bandung, ID
  </text>

  <!-- Name & Tagline -->
  <text x="44" y="112" fill="url(#nameGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">
    Muhammad Irham Bachtiar
  </text>
  <text x="44" y="144" fill="#7aa2f7" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="17.5" font-weight="600">
    Full-Stack Web &amp; Mobile Developer
  </text>
  <text x="44" y="170" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13.5" font-weight="400">
    Crafting scalable web apps and cross-platform mobile experiences.
  </text>

  <!-- Tech chips -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="600">
    <rect x="44" y="196" width="90" height="28" rx="8" fill="#172554" stroke="#1d4ed8" stroke-opacity="0.7"/>
    <text x="89.0" y="214" text-anchor="middle" fill="#93c5fd">TypeScript</text><rect x="142" y="196" width="74" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7"/>
    <text x="179.0" y="214" text-anchor="middle" fill="#e2e8f0">Next.js</text><rect x="224" y="196" width="76" height="28" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-opacity="0.7"/>
    <text x="262.0" y="214" text-anchor="middle" fill="#d8b4fe">Laravel</text><rect x="308" y="196" width="72" height="28" rx="8" fill="#083344" stroke="#0284c7" stroke-opacity="0.7"/>
    <text x="344.0" y="214" text-anchor="middle" fill="#7dd3fc">Flutter</text><rect x="388" y="196" width="68" height="28" rx="8" fill="#312e81" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="422.0" y="214" text-anchor="middle" fill="#c7d2fe">Kotlin</text>
  </g>

  <!-- Right Terminal Code Card -->
  <rect x="570" y="32" width="306" height="198" rx="14" fill="#090d16" fill-opacity="0.96" stroke="#1e293b" stroke-width="1.3"/>
  <rect x="570" y="32" width="306" height="32" rx="14" fill="#111827"/>
  <rect x="570" y="52" width="306" height="12" fill="#111827"/>
  <circle cx="590" cy="48" r="5" fill="#ef4444"/>
  <circle cx="608" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="626" cy="48" r="5" fill="#22c55e"/>
  <text x="723" y="52" text-anchor="middle" fill="#94a3b8" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11.5">profile.ts</text>

  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5">
    <text x="588" y="88">
      <tspan fill="#c084fc">const</tspan>
      <tspan fill="#f8fafc"> irham </tspan>
      <tspan fill="#38bdf8">=</tspan>
      <tspan fill="#94a3b8"> {</tspan>
    </text>
    <text x="588" y="112">
      <tspan fill="#7dd3fc">  github</tspan>
      <tspan fill="#94a3b8">: </tspan>
      <tspan fill="#86efac">"@starfollowme"</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>
    <text x="588" y="136">
      <tspan fill="#7dd3fc">  city</tspan>
      <tspan fill="#94a3b8">:   </tspan>
      <tspan fill="#86efac">"Bandung, ID"</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>
    <text x="588" y="160">
      <tspan fill="#7dd3fc">  web</tspan>
      <tspan fill="#94a3b8">:    </tspan>
      <tspan fill="#fde68a">["Next.js", "Laravel"]</tspan>
      <tspan fill="#94a3b8">,</tspan>
    </text>
    <text x="588" y="184">
      <tspan fill="#7dd3fc">  mobile</tspan>
      <tspan fill="#94a3b8">: </tspan>
      <tspan fill="#fde68a">["Flutter", "Kotlin"]</tspan>
    </text>
    <text x="588" y="208">
      <tspan fill="#94a3b8">};</tspan>
    </text>
    <!-- Blinking terminal cursor -->
    <rect x="615" y="196" width="7.5" height="14" rx="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
